services:
  - type: web
    name: hybrid-rag-document-qa
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: AUTH_ENABLED
        value: "true"
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CHROMA_PATH
        value: /var/lib/atlas/chroma_data
      - key: DATABASE_PATH
        value: /var/lib/atlas/runtime/atlas.db
      - key: GENERATOR
        value: extractive
    disk:
      name: hybrid-rag-data
      mountPath: /var/lib/atlas
      sizeGB: 10
